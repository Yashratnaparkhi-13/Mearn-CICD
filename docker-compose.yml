version: '3.8'

services:
  mongo:
    image: mongo:6
    platform: linux/amd64
    container_name: mern-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  backend:
    build:
      context: ./backend
    container_name: mern-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/mern_cicd
      - APP_VERSION=local
    ports:
      - '5002:5000'
    depends_on:
      - mongo
    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5002/api
        REACT_APP_VERSION: local
    container_name: mern-frontend
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
