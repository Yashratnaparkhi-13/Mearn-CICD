# EXAMPLE ONLY — never commit real secrets to Git.
# Create the real secret directly in the cluster, e.g.:
#   kubectl create secret generic backend-secrets \
#     --from-literal=MONGO_URI='mongodb+srv://user:pass@cluster.mongodb.net/mern' \
#     --from-literal=NODE_ENV='production' \
#     -n mern-production
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  MONGO_URI: 'mongodb+srv://<user>:<password>@<cluster-url>/mern_cicd'
  NODE_ENV: 'production'
  APP_VERSION: 'replace-with-CI_COMMIT_SHORT_SHA'
